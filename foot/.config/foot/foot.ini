[main]
# Dynamic theme colors
include=~/.local/state/omarchy/current/theme/foot.ini

term=xterm-256color

# Font
# Ghostty's font-style=Medium has no counterpart here: the installed
# JetBrainsMono Nerd Font only ships Regular/Bold/Italic/Bold Italic.
font=JetBrainsMono Nerd Font:size=15

# Window
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
# Ghostty: mouse-scroll-multiplier=1.5 applied to its 3-line default.
multiplier=4.5

[cursor]
style=block
blink=no

[key-bindings]
fullscreen=F11
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
